name: Open public traffic

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "open" after operator verification to re-apply fallout-ingress'
        required: true

concurrency:
  group: fallout-production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  open:
    name: Re-apply the public ingress
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "open" ]; then
            echo "::error::Set confirm=open to re-apply the public ingress"
            exit 1
          fi

      - name: Check out deployment manifests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Configure SSH access
        uses: ./.github/actions/hetzner-ssh
        with:
          host: ${{ secrets.HETZNER_HOST }}
          user: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          probe: none

      - name: Apply the public ingress
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes hetzner-prod \
            "set -euo pipefail; kubectl apply -n fallout -f -; kubectl -n fallout get ingress fallout-ingress" < deployment/k3s/ingress.yaml
