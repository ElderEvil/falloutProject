apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: backend
          image: elerevil/fastapi:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: backend-env
          env:
            - name: LOG_JSON_FORMAT
              value: "true"
            - name: LOG_FILE_PATH
              value: /var/log/fallout_shelter/backend.log
            - name: LOG_FILE_RETENTION_DAYS
              value: "14"
          volumeMounts:
            - name: application-logs
              mountPath: /var/log/fallout_shelter
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: application-logs
          persistentVolumeClaim:
            claimName: backend-logs-pvc
