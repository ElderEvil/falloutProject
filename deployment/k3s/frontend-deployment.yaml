apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: elerevil/fo-shelter-fe:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            - name: API_URL
              value: https://fallout-api.evillab.tech
          # Note: VITE_API_BASE_URL is baked into the build
          # Update the Docker build command to pass the correct URL:
          # docker build --build-arg VITE_API_BASE_URL=http://your-domain:port -t elerevil/vuejs:latest ./frontend
