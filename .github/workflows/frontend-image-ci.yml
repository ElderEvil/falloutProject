name: Frontend Image CI

on:
  push:
    branches: [ master ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-image-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-image-ci.yml'

permissions:
  contents: read

jobs:
  frontend-image:
    name: Frontend Image Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build frontend production image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: fo-shelter-fe:smoke
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000
            VERSION=0.0.0-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and smoke test
        run: |
          docker run -d --name fe-smoke -p 3000:3000 fo-shelter-fe:smoke
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3000/ >/dev/null; then
              break
            fi
            sleep 1
          done
          body="$(curl -sf http://localhost:3000/)" || {
            echo "::error::frontend image did not serve HTTP 200 on :3000"
            docker logs fe-smoke
            exit 1
          }
          echo "$body" | grep -q 'id="app"' || {
            echo "::error::served page is missing the Vue mount point"
            exit 1
          }

      - name: Stop container
        if: always()
        run: docker rm -f fe-smoke
