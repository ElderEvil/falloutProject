name: Backend Image CI

on:
  push:
    branches: [ master ]
    paths:
      - 'backend/**'
      - 'CHANGELOG.md'
      - 'scripts/check_backend_image.py'
      - '.github/workflows/backend-image-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'CHANGELOG.md'
      - 'scripts/check_backend_image.py'
      - '.github/workflows/backend-image-ci.yml'

permissions:
  contents: read

jobs:
  backend-image:
    name: Backend Image Smoke (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: fo-shelter-be:smoke
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
          cache-from: type=gha,scope=backend-image-${{ matrix.python-version }}
          cache-to: type=gha,scope=backend-image-${{ matrix.python-version }},mode=max

      - name: Check production backend image
        run: |
          docker run --rm -i --network=none --read-only \
            --tmpfs /tmp --tmpfs /var/log/fallout_shelter:mode=1777 \
            --entrypoint uv fo-shelter-be:smoke run --offline python - < scripts/check_backend_image.py
