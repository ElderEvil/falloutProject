<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Continuous training queue</title>
  </head>
  <body>
    <div id="app" class="max-w-7xl p-4"></div>
    <script type="module">
      import '../../../src/assets/tailwind.css'
      import { createApp, h } from 'vue'
      import { createMemoryHistory, createRouter } from 'vue-router'
      import TrainingView from '../../../src/modules/progression/views/TrainingView.vue'
      import { createPinia } from 'pinia'
      import TrainingQueuePanel from '../../../src/modules/progression/components/training/TrainingQueuePanel.vue'
      import ApprenticeSection from '../../../src/modules/progression/components/training/ApprenticeSection.vue'
      import { useAuthStore } from '../../../src/modules/auth/stores/auth'
      import { useVaultStore } from '../../../src/modules/vault/stores/vault'
      import { useTheme } from '../../../src/core/composables/useTheme'

      const fullPage = new URLSearchParams(location.search).has('full')
      const router = createRouter({
        history: createMemoryHistory(),
        routes: [{ path: '/vault/:id/training', component: TrainingView }],
      })
      await router.push('/vault/vault-1/training')
      if (fullPage) {
        document.getElementById('app').className = ''
        if (innerWidth < 640) localStorage.setItem('sidePanel_collapsed', 'true')
      }
      const vault = await (await fetch('/api/v1/vaults/vault-1')).json()
      useTheme().setTheme(new URLSearchParams(location.search).get('theme') || 'fo4')
      createApp({
        setup() {
          useAuthStore().token = 'fixture-token'
          const store = useVaultStore()
          store.loadedVaults['vault-1'] = vault
          store.activeVaultId = 'vault-1'
          return () =>
            fullPage
              ? h(TrainingView)
              : h('div', { class: 'flex flex-col gap-6' }, [
                  h(TrainingQueuePanel),
                  h(ApprenticeSection),
                ])
        },
      })
        .use(createPinia())
        .use(router)
        .mount('#app')
    </script>
  </body>
</html>
