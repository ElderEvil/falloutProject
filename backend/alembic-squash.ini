# Opt-in graph: the normal alembic.ini continues to use the original history.
# Regenerate baseline_versions/ with scripts/build_alembic_baseline.py after any
# legacy schema migration, until this graph is promoted.
[alembic]
script_location = %(here)s/app/alembic
version_locations = %(here)s/app/alembic/baseline_versions
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
