name: Desktop CI

on:
  push:
    branches: [ master ]
    paths:
      - 'frontend/**'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: 'GitHub release tag to attach desktop packages to (from release.yml).'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64 build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    env:
      # Never bake a developer's local API override into downloadable packages.
      VITE_API_BASE_URL: https://fallout-api.evillab.tech
      # linuxdeploy and its AppImage plugin must also work without a FUSE mount.
      APPIMAGE_EXTRACT_AND_RUN: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file \
            desktop-file-utils xdg-utils dbus

      - name: Install pnpm
        uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: frontend/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Build desktop frontend
        run: pnpm run desktop:bundle

      - name: Check Rust with Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Run native Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Build Linux packages
        if: github.event_name != 'pull_request'
        run: pnpm run desktop:build --ci --bundles deb,appimage -- --locked

      - name: Validate packages and record checksums
        if: github.event_name != 'pull_request'
        working-directory: frontend/src-tauri/target/release/bundle
        run: |
          dpkg-deb --info deb/*.deb
          desktop-file-validate deb/*/data/usr/share/applications/*.desktop
          sha256sum deb/*.deb appimage/*.AppImage > SHA256SUMS

      - name: Upload Linux packages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fallout-desktop-linux-x86_64-${{ github.sha }}
          path: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Attach packages to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: frontend/src-tauri/target/release/bundle
        run: |
          gh release upload "${{ inputs.release_tag }}" deb/*.deb appimage/*.AppImage SHA256SUMS
          gh release view "${{ inputs.release_tag }}" --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'
