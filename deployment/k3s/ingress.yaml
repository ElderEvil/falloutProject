apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fallout-ingress
  namespace: fallout
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: fallout.evillab.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
    - host: fallout-api.evillab.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
  tls:
    - hosts:
        - fallout.evillab.tech
        - fallout-api.evillab.tech
      secretName: fallout-ingress-tls
