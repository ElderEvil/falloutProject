name: Backend Image CI

on:
  push:
    branches: [ master ]
    paths:
      - 'backend/**'
      - 'CHANGELOG.md'
      - 'scripts/check_backend_image.py'
      - '.github/workflows/backend-image-ci.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'backend/**'
      - 'CHANGELOG.md'
      - 'scripts/check_backend_image.py'
      - '.github/workflows/backend-image-ci.yml'

permissions:
  contents: read

jobs:
  backend-image:
    name: Backend Image Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read Python version
        id: python
        run: echo "version=$(cat backend/.python-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: fo-shelter-be:smoke
          build-args: |
            PYTHON_VERSION=${{ steps.python.outputs.version }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,scope=backend-image,mode=max

      - name: Check production backend image
        run: |
          docker run --rm -i --network=none --read-only \
            --tmpfs /tmp --tmpfs /var/log/fallout_shelter:mode=1777 \
            --entrypoint uv fo-shelter-be:smoke run --offline python - < scripts/check_backend_image.py
