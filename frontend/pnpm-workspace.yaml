# === SUPPLY CHAIN SECURITY ===
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - dompurify@3.4.13
  - form-data
  - js-yaml@4.2.0
  - esbuild@0.28.1
  - '@vitest/browser@4.1.10'
  - postcss@8.5.18 || 8.5.23
  - undici@7.29.0
  - nanoid@3.3.17

# === BUILD PERMISSIONS ===
# allowBuilds replaces pnpm 10's onlyBuiltDependencies
allowBuilds:
  '@tailwindcss/vite': true
  '@voidzero-dev/vite-plus-core': true
  '@voidzero-dev/vite-plus-test': true
  esbuild: true
  vue-demi: true

# === DEPENDENCY OVERRIDES ===
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  form-data: 4.0.6
  js-yaml: 4.2.0
  undici: 7.28.0
  postcss: 8.5.15
  minimatch: 5.1.8
  defu: 6.1.5
  fast-uri: 3.1.2
  '@vitest/browser@>=4.0.0 <4.1.10': ^4.1.10
  dompurify@<=3.4.12: 3.4.13
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  js-yaml@>=4.0.0 <4.3.0: 4.3.0
  js-yaml@>=4.0.0 <4.3.1: 4.3.1
  nanoid@<3.3.17: ^3.3.17
  postcss@<=8.5.17: ^8.5.18
  postcss@<=8.5.22: ^8.5.23
  undici@>=7.0.0 <7.29.0: ^7.29.0

# === PACKAGE MANAGER SETTINGS ===
engineStrict: true
lockfile: true
saveExact: true
blockExoticSubdeps: true
strictPeerDependencies: false
autoInstallPeers: true
storeDir: ~/.pnpm-store
modulesCacheMaxAge: 604800
dedupePeerDependents: true
shamefullyHoist: false
