[package]
name = "fallout-desktop"
# Internal crate metadata; tauri.conf.json reads the application version from package.json.
version = "0.0.0"
publish = false
description = "Fallout Shelter desktop shell"
repository = "https://github.com/ElderEvil/falloutProject"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "fallout_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }
