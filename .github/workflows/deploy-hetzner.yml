name: Deploy to Hetzner k3s

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Versioned image tag to deploy (e.g., v2.74.1)'
        required: true
      run_migrations:
        description: 'Run database migrations'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Hetzner k3s
    runs-on: ubuntu-latest

    steps:
      - name: Check out deployment manifests
        uses: actions/checkout@v7

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_key
          chmod 600 ~/.ssh/hetzner_key
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Validate image tag exists
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::image_tag must be a full SemVer tag (e.g. v2.42.0); latest is not deployable. Got: $IMAGE_TAG"
            exit 1
          fi
          for image in fo-shelter-be fo-shelter-fe; do
            if docker buildx imagetools inspect "$DOCKER_USERNAME/$image:$IMAGE_TAG" >/dev/null 2>&1; then
              echo "✅ $DOCKER_USERNAME/$image:$IMAGE_TAG exists"
            else
              echo "::error::$DOCKER_USERNAME/$image:$IMAGE_TAG was never pushed by the build pipeline; refusing to deploy"
              exit 1
            fi
          done

      - name: Configure AI Gateway and Logfire
        env:
          PYDANTIC_AI_GATEWAY_API_KEY: ${{ secrets.PYDANTIC_AI_GATEWAY_API_KEY }}
          PYDANTIC_AI_GATEWAY_ROUTE: ${{ secrets.PYDANTIC_AI_GATEWAY_ROUTE }}
          PYDANTIC_AI_GATEWAY_BASE_URL: ${{ secrets.PYDANTIC_AI_GATEWAY_BASE_URL }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TLS: ${{ secrets.SMTP_TLS }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          set -euo pipefail
          for name in PYDANTIC_AI_GATEWAY_API_KEY PYDANTIC_AI_GATEWAY_ROUTE PYDANTIC_AI_GATEWAY_BASE_URL LOGFIRE_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions secret $name is missing"
              exit 1
            fi
          done

          jq -n \
            --arg gateway_key "$PYDANTIC_AI_GATEWAY_API_KEY" \
            --arg gateway_route "$PYDANTIC_AI_GATEWAY_ROUTE" \
            --arg gateway_base_url "$PYDANTIC_AI_GATEWAY_BASE_URL" \
            --arg logfire_token "$LOGFIRE_TOKEN" \
            --arg smtp_host "${SMTP_HOST:-localhost}" \
            --arg smtp_port "${SMTP_PORT:-1025}" \
            --arg smtp_user "${SMTP_USER:-}" \
            --arg smtp_password "${SMTP_PASSWORD:-}" \
            --arg smtp_tls "${SMTP_TLS:-false}" \
            --arg smtp_ssl "${SMTP_SSL:-false}" \
            --arg email_from_address "${EMAIL_FROM_ADDRESS:-noreply@falloutshelter.com}" \
            --arg email_from_name "${EMAIL_FROM_NAME:-Fallout Shelter}" \
            --arg frontend_url "${FRONTEND_URL:-https://fallout.evillab.tech}" \
            '{apiVersion: "v1", kind: "Secret", metadata: {name: "backend-env", namespace: "fallout"}, type: "Opaque", stringData: {PYDANTIC_AI_GATEWAY_API_KEY: $gateway_key, PYDANTIC_AI_GATEWAY_ROUTE: $gateway_route, PYDANTIC_AI_GATEWAY_BASE_URL: $gateway_base_url, LOGFIRE_TOKEN: $logfire_token, SMTP_HOST: $smtp_host, SMTP_PORT: $smtp_port, SMTP_USER: $smtp_user, SMTP_PASSWORD: $smtp_password, SMTP_TLS: $smtp_tls, SMTP_SSL: $smtp_ssl, EMAIL_FROM_ADDRESS: $email_from_address, EMAIL_FROM_NAME: $email_from_name, FRONTEND_URL: $frontend_url}}' \
            | ssh -i ~/.ssh/hetzner_key ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
              'kubectl apply -f - && kubectl -n fallout set env deployment/backend deployment/dramatiq-worker --from=secret/backend-env'

      - name: Update images
        run: |
          ssh -i ~/.ssh/hetzner_key ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} << 'EOF'
            set -e
            kubectl set image deployment/backend -n fallout \
              backend=${{ secrets.DOCKER_USERNAME }}/fo-shelter-be:${{ inputs.image_tag }}
            kubectl set image deployment/dramatiq-worker -n fallout \
              dramatiq-worker=${{ secrets.DOCKER_USERNAME }}/fo-shelter-be:${{ inputs.image_tag }}
            kubectl set image deployment/frontend -n fallout \
              frontend=${{ secrets.DOCKER_USERNAME }}/fo-shelter-fe:${{ inputs.image_tag }}
          EOF

      - name: Configure persistent application logs
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hetzner_key ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            'kubectl apply -n fallout -f -' < deployment/k3s/backend-logs-pvc.yaml

          ssh -i ~/.ssh/hetzner_key ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} << 'SHELL'
            set -euo pipefail

            kubectl -n fallout set env deployment/backend \
              ENVIRONMENT=production \
              LOG_JSON_FORMAT=true \
              LOG_FILE_PATH=/var/log/fallout_shelter/backend.log \
              LOG_FILE_RETENTION_DAYS=14
            kubectl -n fallout patch deployment/backend --type='strategic' -p='{"spec":{"template":{"spec":{"securityContext":{"fsGroup":1000},"containers":[{"name":"backend","volumeMounts":[{"name":"application-logs","mountPath":"/var/log/fallout_shelter"}]}],"volumes":[{"name":"application-logs","persistentVolumeClaim":{"claimName":"backend-logs-pvc"}}]}}}}'
          SHELL

      - name: Restart deployments and wait for rollout
        run: |
          ssh -i ~/.ssh/hetzner_key ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} << 'EOF'
            set -e

            for deployment in backend dramatiq-worker frontend; do
              echo "Restarting $deployment..."
              kubectl rollout restart "deployment/$deployment" -n fallout
            done

            for deployment in backend dramatiq-worker frontend; do
              echo "Waiting for $deployment..."
              kubectl rollout status "deployment/$deployment" -n fallout --timeout=300s
            done

            echo "All rollouts complete."
          EOF

      - name: Run database migrations
        if: ${{ inputs.run_migrations }}
        run: |
          ssh -i ~/.ssh/hetzner_key ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} << 'EOF'
            set -e

            echo "Running alembic upgrade head..."
            kubectl exec deployment/backend -n fallout -- \
              uv run alembic upgrade head

            echo "Migrations completed."
          EOF

      - name: Verify production environment
        run: |
          ssh -i ~/.ssh/hetzner_key ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            "kubectl exec deployment/backend -n fallout -- python3 -c \"from app.core.config import settings; assert settings.ENVIRONMENT == 'production', f'Expected ENVIRONMENT=production, got {settings.ENVIRONMENT!r}'\""

      - name: Health check
        run: |
          ssh -i ~/.ssh/hetzner_key ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} << 'SHELL'
            set -e

            echo "Checking backend health..."
            MAX_RETRIES=6
            RETRY_DELAY=10
            n=0
            while [ "$n" -lt "$MAX_RETRIES" ]; do
              n=$((n + 1))
              echo "  attempt $n/$MAX_RETRIES..."
              if kubectl exec deployment/backend -n fallout -- python3 -c "import urllib.request,json;d=json.load(urllib.request.urlopen('http://localhost:8000/healthcheck?detailed=true',timeout=10));assert d.get('status') == 'ok', d" 2>/dev/null; then
                echo "  Health check passed."
                exit 0
              fi
              if [ "$n" -lt "$MAX_RETRIES" ]; then
                echo "  Retrying in ${RETRY_DELAY}s..."
                sleep "$RETRY_DELAY"
              fi
            done

            echo "Health check failed after $MAX_RETRIES attempts!"
            kubectl logs -n fallout deployment/backend --tail=30
            exit 1
          SHELL

      - name: Verify persistent API logs
        run: |
          ssh -i ~/.ssh/hetzner_key ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} << 'SHELL'
            set -euo pipefail

            test "$(kubectl -n fallout get pvc backend-logs-pvc -o jsonpath='{.status.phase}')" = "Bound"
            kubectl -n fallout exec deployment/backend -- test -s /var/log/fallout_shelter/backend.log
            kubectl -n fallout exec deployment/backend -- tail -n 1 /var/log/fallout_shelter/backend.log
          SHELL

      - name: Verify AI Gateway and Logfire
        run: |
          ssh -i ~/.ssh/hetzner_key ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} << 'SHELL'
            set -e

            kubectl exec deployment/backend -n fallout -- python3 -c 'import asyncio; from app.core.config import settings; from app.core.logfire_config import configure_logfire, is_logfire_enabled; from app.services.ai_service import get_ai_service; assert settings.ai_provider_mode == "gateway", "AI Gateway is not configured"; assert settings.logfire_enabled, "LOGFIRE_TOKEN is not configured"; configure_logfire(); service = get_ai_service(); assert service.using_gateway and service.is_available(), "AI Gateway model is unavailable"; result = asyncio.run(service.chat_completion_with_usage([{"role": "user", "content": "Reply with exactly: gateway-production-check"}])); assert result.text, "Gateway returned an empty response"; assert is_logfire_enabled(), "Logfire instrumentation did not initialize"; print("Gateway and Logfire verification request completed")'
          SHELL

      - name: Clean up old images
        run: |
          ssh -i ~/.ssh/hetzner_key ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} << 'EOF'
            set -e

            echo "Pruning unused container images..."
            sudo k3s crictl rmi --prune 2>/dev/null || echo "Nothing to prune"

            echo "Cleanup done."
          EOF
