services:
  db:
    image: postgres:18-alpine
    restart: always
    env_file: ".env.local"
    volumes:
      - postgres-data-local:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_INITDB_ARGS=--locale=C --encoding=UTF8

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data-local:/data

  dramatiq_worker:
    container_name: dramatiq_worker
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    env_file: ".env.local"
    environment:
      - POSTGRES_SERVER=db
      - REDIS_HOST=redis
      - FALLOUT_WORKER=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    working_dir: /app
    command: [ "sh", "-c", "uv run periodiq app.core.dramatiq app.api.tasks & uv run dramatiq --processes 1 app.api.tasks" ]
    volumes:
      - ./backend/app:/app/app

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    env_file:
      - .env.local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data_local:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  fastapi:
    container_name: fastapi
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    environment:
      - POSTGRES_SERVER=db
      - REDIS_HOST=redis
      - RUSTFS_HOSTNAME=rustfs
      - RUSTFS_PORT=9000
    env_file: ".env.local"
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_started
    ports:
      - "8000:8000"
    working_dir: /app
    command: [ "sh", "-c", "uv run alembic upgrade head && uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload" ]
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic

  vuejs:
    container_name: vuejs
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

volumes:
  postgres-data-local:
  redis-data-local:
  rustfs_data_local:
