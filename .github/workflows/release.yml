name: Release

on:
  push:
    branches: [ master ]

jobs:
  baseline:
    name: Establish Release Baseline
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag the current synchronized version once
        run: |
          VERSION=$(python3 - <<'PY'
          import json
          import re
          import tomllib

          with open("backend/pyproject.toml", "rb") as file:
              backend_version = tomllib.load(file)["project"]["version"]
          with open("frontend/package.json") as file:
              frontend_version = json.load(file)["version"]
          with open("CHANGELOG.md") as file:
              changelog_version = re.search(r"^## (?:\[)?(\d+\.\d+\.\d+)(?:\])?", file.read(), re.MULTILINE)

          assert backend_version == frontend_version
          assert changelog_version and changelog_version.group(1) == backend_version
          print(backend_version)
          PY
          )
          TAG="v$VERSION"
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null && exit 0
          git config user.name semantic-release-bot
          git config user.email semantic-release-bot@github.com
          git tag -a "$TAG" -m "chore(release): establish $TAG baseline"
          git push origin "$TAG"

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: baseline
    if: "!contains(github.event.head_commit.message, 'chore(release)')"

    outputs:
      release_tag: ${{ steps.published-release.outputs.tag }}
      released: ${{ steps.published-release.outputs.released }}

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Record latest release tag
        id: previous-release
        run: echo "tag=$(git tag --sort=-version:refname --list 'v[0-9]*' | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Install release tooling (working-dir, no root package.json)
        # Extra plugins are not bundled with semantic-release core, so install
        # everything into the working directory (gitignored node_modules) so
        # semantic-release can resolve them from the project cwd. No package.json
        # or lockfile is created/committed. conventional-changelog-conventionalcommits
        # is the preset selected by .releaserc.json and must be resolvable by the
        # commit-analyzer / release-notes-generator plugins.
        run: npm install --no-save --no-package-lock --no-audit --no-fund semantic-release@25.0.9 @semantic-release/changelog@7.0.0 @semantic-release/exec@7.1.0 @semantic-release/git@11.0.1 conventional-changelog-conventionalcommits@8.0.0

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: semantic-release-bot@github.com
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: semantic-release-bot@github.com
        run: npx --no semantic-release

      - name: Identify published release
        id: published-release
        env:
          PREVIOUS_TAG: ${{ steps.previous-release.outputs.tag }}
        run: |
          RELEASE_TAG=$(git tag --sort=-version:refname --list 'v[0-9]*' | head -n 1)
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "$PREVIOUS_TAG" ]; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  build-images:
    name: Build release images
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    permissions:
      contents: read
