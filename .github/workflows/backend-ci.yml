name: Backend CI

on:
  push:
    branches: [ master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/actions/backend-test-setup/**'
      - 'scripts/pre-push'
      - '.pre-commit-config.yaml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/actions/backend-test-setup/**'
      - 'scripts/pre-push'
      - '.pre-commit-config.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UTC_MIGRATION_REQUIRE_POSTGRES: '1'
    permissions:
      contents: read

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: fallout_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up backend test environment
        uses: ./.github/actions/backend-test-setup

      - name: Run linter (prek)
        working-directory: backend
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.sha }}
          # Frontend CI owns its checks; Repository Checks owns actionlint and Gitleaks.
          SKIP: frontend-lint-format,frontend-hardcoded-colors,actionlint,gitleaks
        run: uv run prek run --from-ref "$BASE_REF" --to-ref "$HEAD_REF"

      - name: Run tests
        working-directory: backend
        run: uv run pytest app/tests -n auto -v --tb=short --timeout=180 --timeout-method=thread
