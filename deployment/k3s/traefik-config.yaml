apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    entryPoints:
      websecure:
        # Traefik is the public edge here; no upstream proxy is allowed to
        # supply a client address. Empty trustedIPs makes Traefik discard
        # client-supplied X-Forwarded-* values and write the observed peer.
        forwardedHeaders:
          trustedIPs: []
    service:
      spec:
        externalTrafficPolicy: Local
