name: Build Docker Images

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Published SemVer tag to build (for example, v2.35.0)'
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published SemVer tag to build (for example, v2.35.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }} Image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: Backend
            image: fo-shelter-be
            context: .
            dockerfile: ./backend/Dockerfile
          - name: Frontend
            image: fo-shelter-fe
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::release_tag must be a complete SemVer tag, such as v2.35.0"
            exit 1
          }

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag }}

      - name: Validate release metadata
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          python3 - "$VERSION" <<'PY'
          import json
          import re
          import sys
          import tomllib

          version = sys.argv[1]
          with open("backend/pyproject.toml", "rb") as file:
              backend_version = tomllib.load(file)["project"]["version"]
          with open("frontend/package.json") as file:
              frontend_version = json.load(file)["version"]
          with open("CHANGELOG.md") as file:
              changelog_version = re.search(r"^## \[([^]]+)\]", file.read(), re.MULTILINE)

          assert backend_version == frontend_version == version
          assert changelog_version and changelog_version.group(1) == version
          PY
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "python_version=$(cat backend/.python-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:v${{ steps.release.outputs.version }}
          build-args: |
            PYTHON_VERSION=${{ steps.release.outputs.python_version }}
            VITE_API_BASE_URL=${{ vars.PRODUCTION_API_URL }}
            VERSION=${{ steps.release.outputs.version }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
          cache-to: type=inline
