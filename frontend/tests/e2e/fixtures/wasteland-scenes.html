<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wasteland scene layout fixture</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import '../../../src/assets/tailwind.css'
      import { createApp, h } from 'vue'
      import { createPinia } from 'pinia'
      import { createRouter, createMemoryHistory } from 'vue-router'
      import WastelandScenesPreview from '../../../src/modules/exploration/views/WastelandScenesPreview.vue'
      import ExpeditionSiteModal from '../../../src/modules/exploration/components/ExpeditionSiteModal.vue'
      const Preview = new URLSearchParams(location.search).has('picker')
        ? {
            render: () =>
              h(ExpeditionSiteModal, {
                show: true,
                explorationId: 'preview-picker',
                dwellerName: 'Rachel Miller',
                explorationActive: true,
              }),
          }
        : WastelandScenesPreview
      const router = createRouter({
        history: createMemoryHistory(),
        routes: [
          { path: '/', component: WastelandScenesPreview },
          { path: '/dev', component: { template: '<div>Development tools</div>' } },
        ],
      })
      router.push('/')
      router.isReady().then(() => createApp(Preview).use(router).use(createPinia()).mount('#app'))
    </script>
  </body>
</html>
