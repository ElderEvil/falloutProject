apiVersion: apps/v1
kind: Deployment
metadata:
  name: dramatiq-worker
spec:
  # One replica owns Periodiq, so keep this at 1 until scheduler ownership is
  # separated. Multiple schedulers can enqueue the same periodic tick twice.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dramatiq-worker
  template:
    metadata:
      labels:
        app: dramatiq-worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: dramatiq-worker
          image: elerevil/fo-shelter-be:latest
          envFrom:
            - secretRef:
                name: backend-env
            - secretRef:
                name: rustfs-credentials
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: REDIS_HOST
              value: redis-service
            - name: REDIS_PORT
              value: "6379"
            - name: EMAIL_TEST_USER
              value: test@fallout.evillab.tech
            - name: USERS_OPEN_REGISTRATION
              value: "true"
            - name: STORAGE_PROVIDER
              value: rustfs
            - name: FALLOUT_WORKER
              value: "1"
            - name: LOG_JSON_FORMAT
              value: "true"
            - name: DRAMATIQ_PROCESSES
              value: "2"
            - name: DRAMATIQ_THREADS
              value: "8"
            - name: POSTGRES_MAX_CONNECTIONS
              value: "100"
            # 4 per thread loop: a tick holds one session while a nested objective
            # handler opens a second, and a concurrent handler needs headroom.
            # Budget: 3 reserved + 15 API + 2*8*4 task = 82 < POSTGRES_MAX_CONNECTIONS.
            - name: TASK_DB_POOL_SIZE
              value: "4"
            - name: TASK_DB_MAX_OVERFLOW
              value: "0"
          command: ["sh", "-c"]
          args:
            - |
              set -u
              uv run periodiq app.core.dramatiq app.api.tasks &
              PERIODIQ_PID=$!
              uv run dramatiq --processes "${DRAMATIQ_PROCESSES:-1}" --threads "${DRAMATIQ_THREADS:-8}" --worker-shutdown-timeout 15000 app.api.tasks &
              DRAMATIQ_PID=$!
              shutdown() {
                trap - TERM INT
                kill -TERM "$PERIODIQ_PID" "$DRAMATIQ_PID" 2>/dev/null || true
                wait "$PERIODIQ_PID" "$DRAMATIQ_PID" 2>/dev/null || true
                exit 0
              }
              trap shutdown TERM INT
              while kill -0 "$PERIODIQ_PID" 2>/dev/null && kill -0 "$DRAMATIQ_PID" 2>/dev/null; do
                sleep 1
              done
              exit 1
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "3Gi"
              cpu: "3"
