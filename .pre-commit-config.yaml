fail_fast: false

default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.17.4"
    hooks:
      # Python files only — ruff 0.16 would otherwise re-format code blocks inside *.md
      - id: ruff
        args: [ --fix, --exit-non-zero-on-fix ]
        files: \.py$
      - id: ruff-format
        files: \.py$

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.13.7
    hooks:
      - id: uv-lock

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        entry: bash scripts/check-secrets.sh
        # Scan the commit range even when its final tree has no changed files.
        always_run: true

  - repo: local
    hooks:
      - id: ty
        name: ty type check (changed backend files)
        entry: bash -c 'cd backend && uv run ty check --output-format concise --exit-zero-on-warning "${@#backend/}"' --
        language: system
        files: ^backend/.*\.py$
        exclude: ^backend/app/(tests|alembic|crud)/
        types: [python]
      - id: frontend-lint-format
        name: frontend lint+format (staged)
        entry: sh -c 'cd frontend && pnpm exec vp staged'
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: frontend-hardcoded-colors
        name: frontend hardcoded color guard
        entry: sh -c 'cd frontend && node scripts/check-hardcoded-colors.mjs'
        language: system
        files: ^frontend/src/.*\.(ts|vue|css)$
        pass_filenames: false

# sets up .pre-commit-ci.yaml to ensure pre-commit dependencies stay up to date
ci:
  autoupdate_schedule: weekly
  # Go tool installation is owned by our GitHub Actions job, not pre-commit.ci.
  skip: [ty, frontend-lint-format, frontend-hardcoded-colors, actionlint, gitleaks]
  submodules: false
