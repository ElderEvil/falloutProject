# === SUPPLY CHAIN SECURITY ===
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - dompurify@3.4.13
  - form-data
  - js-yaml@4.2.0
  - esbuild@0.28.1
  - '@vitest/browser@4.1.10'
  - postcss@8.5.18 || 8.5.23
  - undici@7.29.0
  - nanoid@3.3.17
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
  - vitest
  - '@vitest/*'

# === BUILD PERMISSIONS ===
# allowBuilds replaces pnpm 10's onlyBuiltDependencies
allowBuilds:
  '@tailwindcss/vite': true
  '@voidzero-dev/vite-plus-core': true
  '@voidzero-dev/vite-plus-test': true
  esbuild: true
  vue-demi: true

# === DEPENDENCY OVERRIDES ===
overrides:
  # Pinned (not `@latest`): `@latest` re-resolves on every install and can pull a release newer
  # than `minimumReleaseAge`, which fails the lockfile supply-chain policy check (plan §10).
  # Security fixes: keep these at or above the Dependabot patched versions.
  form-data: 4.0.6
  follow-redirects: 1.16.2
  js-yaml: 4.3.2
  undici: 7.30.1
  postcss: 8.5.23
  brace-expansion: 2.1.7
  source-map-js: 1.2.2
  minimatch: 5.1.8
  defu: 6.1.5
  fast-uri: 3.1.2
  dompurify@<=3.4.12: 3.4.13
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  nanoid@<3.3.17: ^3.3.17
  vite@*: 'catalog:'

# === PACKAGE MANAGER SETTINGS ===
engineStrict: true
lockfile: true
saveExact: true
blockExoticSubdeps: true
strictPeerDependencies: false
autoInstallPeers: true
storeDir: ~/.pnpm-store
modulesCacheMaxAge: 604800
dedupePeerDependents: true
shamefullyHoist: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.5.0
  # vitest itself is NOT a direct dep: it comes bundled with vite-plus
  # (vite-plus pins it exactly). These two release in lockstep with vitest
  # and must be bumped to match whenever vite-plus bumps its bundled vitest.
  '@vitest/coverage-v8': 5.1.0
  '@vitest/ui': 5.1.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
