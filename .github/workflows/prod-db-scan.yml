name: Prod DB cleanup scan (temporary)

on:
  workflow_dispatch:

jobs:
  scan:
    name: Scan prod for stale vaults / cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_key
          chmod 600 ~/.ssh/hetzner_key
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Gather DB inventory
        run: |
          ssh -i ~/.ssh/hetzner_key ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} << 'EOF'
            PG_POD=$(kubectl -n fallout get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}')
            q() { kubectl -n fallout exec "$PG_POD" -- sh -c "psql -U \"\$(printenv POSTGRES_USER)\" -d \"\$(printenv POSTGRES_DB)\" -t -A -F '|' -c \"$1\""; }

            echo "===== USER COLUMNS ====="
            q "SELECT column_name || ':' || data_type FROM information_schema.columns WHERE table_schema='public' AND table_name='user' ORDER BY ordinal_position;" || true
            echo "===== VAULT COLUMNS ====="
            q "SELECT column_name || ':' || data_type FROM information_schema.columns WHERE table_schema='public' AND table_name='vault' ORDER BY ordinal_position;" || true

            echo "===== USERS ====="
            q "SELECT username, email, is_active, created_at::date, updated_at::date FROM \"user\" ORDER BY updated_at DESC LIMIT 30;" || true

            echo "===== VAULT INVENTORY ====="
            q "SELECT v.number, u.username, v.is_deleted, v.created_at::date, v.updated_at::date FROM vault v JOIN \"user\" u ON u.id=v.user_id ORDER BY v.updated_at DESC;" || true

            echo "===== DELETED VAULTS ====="
            q "SELECT count(*) AS deleted_vaults, max(deleted_at)::date AS last_deleted FROM vault WHERE is_deleted=true;" || true

            echo "===== EMPTY VAULTS (not deleted, 0 live dwellers) ====="
            q "SELECT v.number, u.username, v.created_at::date, v.updated_at::date FROM vault v JOIN \"user\" u ON u.id=v.user_id WHERE v.is_deleted=false AND NOT EXISTS (SELECT 1 FROM dweller d WHERE d.vault_id=v.id AND d.is_deleted=false);" || true

            echo "===== INACTIVE VAULTS (updated >30d ago) ====="
            q "SELECT v.number, u.username, v.updated_at::date FROM vault v JOIN \"user\" u ON u.id=v.user_id WHERE v.updated_at < now() - interval '30 days' ORDER BY v.updated_at;" || true

            echo "===== TEST USERS (conc_/dbg_/incident_) ====="
            q "SELECT u.username, u.is_active, count(v.id) AS vaults FROM \"user\" u LEFT JOIN vault v ON v.user_id=u.id WHERE u.username ~ '^(conc|dbg|incident)_' GROUP BY u.username, u.is_active;" || true

            echo "===== VOLUME ====="
            q "SELECT 'vaults', count(*) FROM vault UNION ALL SELECT 'dwellers_total', count(*) FROM dweller UNION ALL SELECT 'dwellers_soft_deleted', count(*) FROM dweller WHERE is_deleted=true UNION ALL SELECT 'notifications', count(*) FROM notification UNION ALL SELECT 'incidents', count(*) FROM incident UNION ALL SELECT 'relationships', count(*) FROM relationship UNION ALL SELECT 'pregnancies', count(*) FROM pregnancy UNION ALL SELECT 'explorations', count(*) FROM exploration UNION ALL SELECT 'quests', count(*) FROM quest UNION ALL SELECT 'llm_interactions', count(*) FROM llminteraction;" || true

            echo "===== DONE ====="
          EOF