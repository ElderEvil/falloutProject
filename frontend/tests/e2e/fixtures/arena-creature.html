<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Arena creature facing fixture</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, h } from 'vue'
      import ArenaCreatureSlot from '../../../src/modules/rooms/components/ArenaCreatureSlot.vue'
      const params = new URLSearchParams(location.search)
      const mirror = params.get('mirror') === 'true'
      const isRobot = params.get('robot') === 'true'
      const key = isRobot ? 'training-eyebot' : 'giant-radscorpion'
      const name = isRobot ? 'Training Eyebot' : 'Radscorpion'
      createApp({
        render: () =>
          h(ArenaCreatureSlot, {
            creature: {
              key,
              name,
              is_robot: isRobot,
              power: 35,
              health: 20,
              max_health: 35,
              id: 'radscorpion-1',
            },
            canChange: true,
            options: [{ key, name, is_robot: isRobot, power: 35, max_hp: 35 }],
            pickerOpen: true,
            mirror,
            mirrorBots: params.get('enemy') === 'true',
          }),
      }).mount('#app')
    </script>
  </body>
</html>
