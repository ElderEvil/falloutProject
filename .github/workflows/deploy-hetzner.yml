name: Deploy to Hetzner k3s

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g., latest, sha-abc123)'
        required: false
        default: 'latest'
      run_migrations:
        description: 'Run database migrations'
        required: false
        type: boolean
        default: true

jobs:
  deploy:
    name: Deploy to Hetzner k3s
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_key
          chmod 600 ~/.ssh/hetzner_key
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Validate image tag exists
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          set -euo pipefail
          if [[ "$IMAGE_TAG" != "latest" && ! "$IMAGE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::image_tag must be 'latest' or a full SemVer tag (e.g. v2.42.0); build.yml only pushes those tags. Got: $IMAGE_TAG"
            exit 1
          fi
          for image in fo-shelter-be fo-shelter-fe; do
            if docker buildx imagetools inspect "$DOCKER_USERNAME/$image:$IMAGE_TAG" >/dev/null 2>&1; then
              echo "✅ $DOCKER_USERNAME/$image:$IMAGE_TAG exists"
            else
              echo "::error::$DOCKER_USERNAME/$image:$IMAGE_TAG was never pushed by the build pipeline; refusing to deploy"
              exit 1
            fi
          done

      - name: Configure AI Gateway and Logfire
        env:
          PYDANTIC_AI_GATEWAY_API_KEY: ${{ secrets.PYDANTIC_AI_GATEWAY_API_KEY }}
          PYDANTIC_AI_GATEWAY_ROUTE: ${{ secrets.PYDANTIC_AI_GATEWAY_ROUTE }}
          PYDANTIC_AI_GATEWAY_BASE_URL: ${{ secrets.PYDANTIC_AI_GATEWAY_BASE_URL }}
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
        run: |
          set -euo pipefail
          for name in PYDANTIC_AI_GATEWAY_API_KEY PYDANTIC_AI_GATEWAY_ROUTE PYDANTIC_AI_GATEWAY_BASE_URL LOGFIRE_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions secret $name is missing"
              exit 1
            fi
          done

          jq -n \
            --arg gateway_key "$PYDANTIC_AI_GATEWAY_API_KEY" \
            --arg gateway_route "$PYDANTIC_AI_GATEWAY_ROUTE" \
            --arg gateway_base_url "$PYDANTIC_AI_GATEWAY_BASE_URL" \
            --arg logfire_token "$LOGFIRE_TOKEN" \
            '{apiVersion: "v1", kind: "Secret", metadata: {name: "backend-env", namespace: "fallout"}, type: "Opaque", stringData: {PYDANTIC_AI_GATEWAY_API_KEY: $gateway_key, PYDANTIC_AI_GATEWAY_ROUTE: $gateway_route, PYDANTIC_AI_GATEWAY_BASE_URL: $gateway_base_url, LOGFIRE_TOKEN: $logfire_token}}' \
            | ssh -i ~/.ssh/hetzner_key ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
              'kubectl apply -f - && kubectl -n fallout set env deployment/backend deployment/dramatiq-worker --from=secret/backend-env'

      - name: Update images
        run: |
          TAG="${{ inputs.image_tag }}"
          echo "Deploying tag: $TAG"

          ssh -i ~/.ssh/hetzner_key ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} << EOF
            set -e

            echo "Updating backend..."
            kubectl set image deployment/backend -n fallout \
              backend=${{ secrets.DOCKER_USERNAME }}/fo-shelter-be:$TAG

            echo "Updating dramatiq-worker..."
            kubectl set image deployment/dramatiq-worker -n fallout \
              dramatiq-worker=${{ secrets.DOCKER_USERNAME }}/fo-shelter-be:$TAG

            echo "Updating frontend..."
            kubectl set image deployment/frontend -n fallout \
              frontend=${{ secrets.DOCKER_USERNAME }}/fo-shelter-fe:$TAG

            echo "Updated all images. Waiting for rollouts..."
          EOF

      - name: Restart deployments and wait for rollout
        run: |
          ssh -i ~/.ssh/hetzner_key ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} << 'EOF'
            set -e

            echo "Restarting backend..."
            kubectl rollout restart deployment/backend -n fallout

            echo "Restarting dramatiq-worker..."
            kubectl rollout restart deployment/dramatiq-worker -n fallout

            echo "Restarting frontend..."
            kubectl rollout restart deployment/frontend -n fallout

            echo "Waiting for backend..."
            kubectl rollout status deployment/backend -n fallout --timeout=300s

            echo "Waiting for dramatiq-worker..."
            kubectl rollout status deployment/dramatiq-worker -n fallout --timeout=300s

            echo "Waiting for frontend..."
            kubectl rollout status deployment/frontend -n fallout --timeout=300s

            echo "All rollouts complete."
          EOF

      - name: Run database migrations
        if: ${{ inputs.run_migrations }}
        run: |
          ssh -i ~/.ssh/hetzner_key ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} << 'EOF'
            set -e

            echo "Running alembic upgrade head..."
            kubectl exec deployment/backend -n fallout -- \
              uv run alembic upgrade head

            echo "Migrations completed."
          EOF

      - name: Health check
        run: |
          ssh -i ~/.ssh/hetzner_key ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} << 'SHELL'
            set -e

            echo "Checking backend health..."
            MAX_RETRIES=6
            RETRY_DELAY=10
            n=0
            while [ "$n" -lt "$MAX_RETRIES" ]; do
              n=$((n + 1))
              echo "  attempt $n/$MAX_RETRIES..."
              if kubectl exec deployment/backend -n fallout -- python3 -c "import urllib.request,sys;r=urllib.request.urlopen('http://localhost:8000/healthcheck',timeout=10);b=r.read().decode();import json;d=json.loads(b);assert d.get('status')=='ok' or d.get('ok') is True" 2>/dev/null; then
                echo "  Health check passed."
                exit 0
              fi
              if [ "$n" -lt "$MAX_RETRIES" ]; then
                echo "  Retrying in ${RETRY_DELAY}s..."
                sleep "$RETRY_DELAY"
              fi
            done

            echo "Health check failed after $MAX_RETRIES attempts!"
            kubectl logs -n fallout deployment/backend --tail=30
            exit 1
          SHELL

      - name: Verify AI Gateway and Logfire
        run: |
          ssh -i ~/.ssh/hetzner_key ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} << 'SHELL'
            set -e

            kubectl exec deployment/backend -n fallout -- python3 -c 'import asyncio; from app.core.config import settings; from app.core.logfire_config import configure_logfire, is_logfire_enabled; from app.services.ai_service import get_ai_service; assert settings.ai_provider_mode == "gateway", "AI Gateway is not configured"; assert settings.logfire_enabled, "LOGFIRE_TOKEN is not configured"; configure_logfire(); service = get_ai_service(); assert service.using_gateway and service.is_available(), "AI Gateway model is unavailable"; result = asyncio.run(service.chat_completion_with_usage([{"role": "user", "content": "Reply with exactly: gateway-production-check"}])); assert result.text, "Gateway returned an empty response"; assert is_logfire_enabled(), "Logfire instrumentation did not initialize"; print("Gateway and Logfire verification request completed")'
          SHELL

      - name: Clean up old images
        run: |
          ssh -i ~/.ssh/hetzner_key ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} << 'EOF'
            set -e

            echo "Pruning unused container images..."
            sudo k3s crictl rmi --prune 2>/dev/null || echo "Nothing to prune"

            echo "Cleanup done."
          EOF

      - name: Deployment summary
        run: |
          echo "## Deploy to Hetzner k3s" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image tag | \`${{ inputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Migrations | ${{ inputs.run_migrations }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Host | ${{ secrets.HETZNER_HOST }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | \`fallout\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Backend: \`${{ secrets.DOCKER_USERNAME }}/fo-shelter-be:${{ inputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "  - Deployment: \`backend\`" >> $GITHUB_STEP_SUMMARY
          echo "  - Deployment: \`dramatiq-worker\`" >> $GITHUB_STEP_SUMMARY
          echo "Frontend: \`${{ secrets.DOCKER_USERNAME }}/fo-shelter-fe:${{ inputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployment completed" >> $GITHUB_STEP_SUMMARY
