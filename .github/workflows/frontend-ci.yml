name: Frontend CI

on:
  push:
    branches: [ master ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read
  pull-requests: read # paths-filter reads changed files on pull requests

jobs:
  frontend-ci:
    name: Frontend Tests
    runs-on: ubuntu-latest
    env:
      PNPM_CONFIG_STORE_DIR: ~/.pnpm-store

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect source changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            src:
              - 'frontend/src/**'
              - 'frontend/tests/**'
              - 'frontend/e2e/**'
              - 'frontend/scripts/**'
              - 'frontend/public/**'
              - 'frontend/index.html'
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/pnpm-workspace.yaml'
              - 'frontend/.npmrc'
              - 'frontend/vite.config.*'
              - 'frontend/vitest.config.*'
              - 'frontend/vitest.setup.*'
              - 'frontend/tsconfig*.json'
              - 'frontend/playwright.config.*'
              - 'frontend/oxlint.json'
              - 'frontend/components.d.ts'
              - '.github/workflows/frontend-ci.yml'

      - name: Restore pnpm binary
        id: pnpm-bin
        uses: actions/cache@v6
        with:
          path: ~/setup-pnpm
          key: pnpm-bin-11.9.0-${{ runner.os }}

      - name: Add cached pnpm to PATH
        if: steps.pnpm-bin.outputs.cache-hit == 'true'
        run: |
          for d in "$HOME/setup-pnpm/node_modules/.bin" "$HOME/setup-pnpm"; do
            if [ -x "$d/pnpm" ]; then
              export PATH="$d:$PATH"; echo "$d" >> "$GITHUB_PATH"
              break
            fi
          done
          command -v pnpm

      - name: Install pnpm
        if: steps.pnpm-bin.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          dest: ~/setup-pnpm
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          check-latest: true
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run linter
        if: steps.filter.outputs.src == 'true'
        working-directory: frontend
        run: pnpm run lint

      - name: Run typecheck
        if: steps.filter.outputs.src == 'true'
        working-directory: frontend
        run: pnpm run typecheck

      - name: Check module boundaries
        if: steps.filter.outputs.src == 'true'
        working-directory: frontend
        run: node scripts/check-boundaries.mjs

      - name: Check hardcoded colors
        if: steps.filter.outputs.src == 'true'
        working-directory: frontend
        run: node scripts/check-hardcoded-colors.mjs

      - name: Check raw native controls
        if: steps.filter.outputs.src == 'true'
        working-directory: frontend
        run: node scripts/check-raw-controls.mjs

      - name: Run tests with coverage
        if: steps.filter.outputs.src == 'true'
        working-directory: frontend
        run: pnpm run test:run --coverage

      - name: Install Playwright Chromium
        if: steps.filter.outputs.src == 'true'
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run CRT visual baselines
        if: steps.filter.outputs.src == 'true'
        working-directory: frontend
        env:
          PW_SKIP_BACKEND: '1'
        run: pnpm exec playwright test tests/e2e/animation-gallery.spec.ts tests/e2e/crt-baselines.spec.ts tests/e2e/arena-creature-facing.spec.ts tests/e2e/barbershop-slots.spec.ts tests/e2e/arena-roster.spec.ts tests/e2e/arena-setup.spec.ts tests/e2e/combat-playback.spec.ts tests/e2e/skill-icons.spec.ts tests/e2e/arena-ring.spec.ts tests/e2e/incident-scene.spec.ts tests/e2e/overseer-briefing-contrast.spec.ts tests/e2e/onboarding-spotlight.spec.ts

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-crt-baselines
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build check
        working-directory: frontend
        run: pnpm run build

      - name: Check bundle budget
        if: steps.filter.outputs.src == 'true'
        working-directory: frontend
        run: node scripts/check-bundle-budget.mjs
