<!doctype html>
<html lang="en">

    <div id="app"></div>

      import { createPinia } from 'pinia'
      import { createRouter, createMemoryHistory } from 'vue-router'
      import { useAuthStore } from '../../../src/modules/auth/stores/auth'
      import AdminTerminal from '../../../src/modules/console/components/AdminTerminal.vue'

      const pinia = createPinia()
      const auth = useAuthStore(pinia)
      auth.token = 'fixture'
      auth.user = {
        id: 'admin-fixture',
        username: 'Overseer',
        email: 'admin@example.com',
        is_active: true,
        is_superuser: true,
        email_verified: true,
        has_password: true,
        created_at: '2026-10-26T12:00:00Z',
        updated_at: '2026-10-26T12:00:00Z',

      const router = createRouter({

        routes: [

          { path: '/vault/:id/exploration/:explorationId', component: { render: () => null } },

      })
      await router.push('/vault/92d378b7-3835-43bd-84e3-dc005ef4d44b')
      const App = defineComponent({
        setup: () => () =>
          h('main', { class: 'p-8' }, [
            h('label', { for: 'bio' }, 'Bio'),
            h('textarea', { id: 'bio' }),
            h(AdminTerminal),
          ]),
      })
      createApp(App).use(pinia).use(router).mount('#app')
    </script>
