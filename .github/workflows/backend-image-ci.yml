name: Backend Image CI

on:
  push:
    branches: [ master ]
    paths:
      - 'backend/**'
      - 'CHANGELOG.md'
      - 'scripts/check_backend_image.py'
      - '.github/workflows/backend-image-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'CHANGELOG.md'
      - 'scripts/check_backend_image.py'
      - '.github/workflows/backend-image-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-image:
    name: Backend Image Smoke (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Build backend production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: fo-shelter-be:smoke
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
          cache-from: type=gha,scope=backend-image-${{ matrix.python-version }}
          cache-to: type=gha,scope=backend-image-${{ matrix.python-version }},mode=max

      - name: Check production backend image
        run: |
          docker run --rm -i --network=none --read-only \
            --tmpfs /tmp --tmpfs /var/log/fallout_shelter:mode=1777 \
            --entrypoint uv fo-shelter-be:smoke run --offline python - < scripts/check_backend_image.py
