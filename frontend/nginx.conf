server {
    listen 3000;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Immutable is only safe for content-addressed paths: Vite's hashed bundles at the top of
    # /assets/ and the hashed scene directories. Public files are copied verbatim and keep
    # their URLs (combat/skill-hit.webp, vault-boy/*, room-scenes/manifest.json), so a replaced
    # file would otherwise stay stale in browsers for a year — they get the short lifetime below.
    location ~* "^/assets/[^/]+-[A-Za-z0-9_-]+\.(?:js|css|woff2?|png|jpe?g|webp|svg|avif)$|^/assets/(?:room-grid|wasteland-scenes)/" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.evillab.tech; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.evillab.tech; font-src 'self' data:; connect-src 'self' https://*.evillab.tech wss://*.evillab.tech https://api.iconify.design __EXTRA_API_ORIGINS__; media-src 'self' blob: https://*.evillab.tech; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.evillab.tech; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.evillab.tech; font-src 'self' data:; connect-src 'self' https://*.evillab.tech wss://*.evillab.tech https://api.iconify.design __EXTRA_API_ORIGINS__; media-src 'self' blob: https://*.evillab.tech; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.evillab.tech; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.evillab.tech; font-src 'self' data:; connect-src 'self' https://*.evillab.tech wss://*.evillab.tech https://api.iconify.design __EXTRA_API_ORIGINS__; media-src 'self' blob: https://*.evillab.tech; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
