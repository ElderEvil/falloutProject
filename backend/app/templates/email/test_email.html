<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ project_name }} — Test Email</title>
  </head>
  <body style="margin: 0; padding: 0; background: #0b0f0a; color: #00ff00; font-family: monospace;">
    <div style="max-width: 600px; margin: 0 auto; padding: 24px;">
      <h1 style="border-bottom: 1px solid #00ff00; padding-bottom: 8px;">{{ project_name }}</h1>
      <p style="font-size: 16px;">Test email delivered successfully.</p>
      <p style="white-space: pre-wrap;">{{ message }}</p>
      <hr style="border: none; border-top: 1px solid #00ff00; margin: 24px 0;" />
      <p style="font-size: 12px; opacity: 0.7;">
        Routed via SMTP server <strong>{{ smtp_host }}:{{ smtp_port }}</strong>.
        If you are reading this, your Mailcow (or configured SMTP) relay is working.
      </p>
    </div>
  </body>
</html>
