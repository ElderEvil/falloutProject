name: Frontend Coverage

on:
  schedule:
    # Run nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-coverage:
    name: Frontend Tests with Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up frontend
        uses: ./.github/actions/frontend-setup

      - name: Run tests with coverage
        working-directory: frontend
        run: pnpm run test:coverage

      - name: Generate coverage badge JSON
        working-directory: frontend
        run: |
          python3 - <<'PY'
          import json

          pct = float(json.load(open("coverage/coverage-summary.json"))["total"]["lines"]["pct"])
          color = (
              "brightgreen" if pct >= 90
              else "green" if pct >= 80
              else "yellowgreen" if pct >= 70
              else "yellow" if pct >= 60
              else "orange" if pct >= 50
              else "red"
          )
          badge = {"schemaVersion": 1, "label": "frontend coverage", "message": f"{pct:.2f}%", "color": color}
          with open("coverage-badge.json", "w") as f:
              json.dump(badge, f)
          PY

      - name: Upload coverage badge to Gist
        uses: exuanbo/actions-deploy-gist@47697fceaeea2006a90594ee24eb9cd0a1121ef8 # v1.1.4
        with:
          token: ${{ secrets.GIST_TOKEN }}
          gist_id: 7cc382e5dbf89fbe5bc026b6d8a0ab88
          file_path: frontend/coverage-badge.json
          gist_file_name: coverage-badge-fe.json
          file_type: text

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage-report
          path: frontend/coverage
