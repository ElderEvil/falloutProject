# Legacy graph: the original migration history retained for databases that still
# need to reach the frozen legacy head before baseline adoption, and for rollback.
# New installs and the deployment path use alembic.ini (one squashed baseline).
[alembic]
script_location = %(here)s/app/alembic
version_locations = %(here)s/app/alembic/versions
prepend_sys_path = .
path_separator = os

sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
