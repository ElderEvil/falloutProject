name: Frontend CI

on:
  push:
    branches: [ master ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/actions/frontend-setup/**'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/actions/frontend-setup/**'

permissions:
  contents: read
  pull-requests: read # paths-filter reads changed files on pull requests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PNPM_CONFIG_STORE_DIR: ~/.pnpm-store

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Detect source changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        with:
          filters: |
            src:
              - 'frontend/src/**'
              - 'frontend/tests/**'
              - 'frontend/e2e/**'
              - 'frontend/scripts/**'
              - 'frontend/public/**'
              - 'frontend/index.html'
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/pnpm-workspace.yaml'
              - 'frontend/.npmrc'
              - 'frontend/vite.config.*'
              - 'frontend/vitest.config.*'
              - 'frontend/vitest.setup.*'
              - 'frontend/tsconfig*.json'
              - 'frontend/playwright.config.*'
              - 'frontend/oxlint.json'
              - 'frontend/components.d.ts'
              - '.github/workflows/frontend-ci.yml'
              - '.github/actions/frontend-setup/**'

      - name: Set up frontend
        uses: ./.github/actions/frontend-setup

      - name: Run linter
        if: steps.filter.outputs.src == 'true'
        working-directory: frontend
        run: pnpm run lint

      - name: Check formatting
        if: steps.filter.outputs.src == 'true'
        working-directory: frontend
        run: pnpm run format:check

      - name: Run typecheck
        if: steps.filter.outputs.src == 'true'
        working-directory: frontend
        run: pnpm run typecheck

      - name: Check module boundaries
        if: steps.filter.outputs.src == 'true'
        working-directory: frontend
        run: node scripts/check-boundaries.mjs

      - name: Check hardcoded colors
        if: steps.filter.outputs.src == 'true'
        working-directory: frontend
        run: node scripts/check-hardcoded-colors.mjs

      - name: Check raw native controls
        if: steps.filter.outputs.src == 'true'
        working-directory: frontend
        run: node scripts/check-raw-controls.mjs

      - name: Run tests with coverage
        if: steps.filter.outputs.src == 'true'
        working-directory: frontend
        run: pnpm run test:run --coverage

      - name: Build check
        working-directory: frontend
        run: pnpm run build

      - name: Check bundle budget
        if: steps.filter.outputs.src == 'true'
        working-directory: frontend
        run: node scripts/check-bundle-budget.mjs

      - name: Install Playwright Chromium
        if: steps.filter.outputs.src == 'true'
        # Includes apt downloads for browser system dependencies on a cold runner.
        timeout-minutes: 15
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # Both specs mock their API and run against Vite alone (PW_SKIP_BACKEND); the guard
      # spec must stay here or a router regression ships silently.
      - name: Run browser checks
        if: steps.filter.outputs.src == 'true'
        timeout-minutes: 15
        working-directory: frontend
        env:
          PW_SKIP_BACKEND: '1'
        run: >-
          pnpm exec playwright test
          tests/e2e/accessibility.spec.ts
          tests/e2e/auth-guard.spec.ts
          --project=chromium
