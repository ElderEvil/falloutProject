apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: backend
          image: elerevil/fo-shelter-be:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: backend-env
            - secretRef:
                name: rustfs-credentials
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: REDIS_HOST
              value: redis-service
            - name: REDIS_PORT
              value: "6379"
            - name: EMAIL_TEST_USER
              value: test@fallout.evillab.tech
            - name: USERS_OPEN_REGISTRATION
              value: "true"
            - name: DOMAIN
              value: fallout-api.evillab.tech
            - name: BACKEND_CORS_ORIGINS
              value: '["https://fallout.evillab.tech"]'
            - name: STORAGE_PROVIDER
              value: rustfs
            - name: AUTO_BAN_THRESHOLD
              value: "50"
            - name: LOG_JSON_FORMAT
              value: "true"
            - name: LOG_FILE_PATH
              value: /var/log/fallout_shelter/backend.log
            - name: LOG_FILE_RETENTION_DAYS
              value: "14"
            - name: ENABLE_RATE_LIMITING
              value: "true"
            - name: RATE_LIMIT_REQUESTS
              value: "600"
            - name: RATE_LIMIT_WINDOW
              value: "60"
            - name: SECURITY_TRUSTED_PROXIES
              value: '["10.42.0.0/16"]'
            - name: SECURITY_TRUSTED_PROXY_DEPTH
              value: "1"
            - name: SECURITY_REDIS_FAIL_OPEN
              value: "true"
            - name: POSTGRES_MAX_CONNECTIONS
              value: "100"
            # Pin the uvicorn process count: a WEB_CONCURRENCY value inherited
            # from the secret would otherwise multiply the API pool and break
            # the connection budget validated from this same value.
            - name: WEB_CONCURRENCY
              value: "1"
            - name: API_DB_POOL_SIZE
              value: "10"
            - name: API_DB_MAX_OVERFLOW
              value: "5"
          volumeMounts:
            - name: application-logs
              mountPath: /var/log/fallout_shelter
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: application-logs
          persistentVolumeClaim:
            claimName: backend-logs-pvc
