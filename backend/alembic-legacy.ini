# Frozen legacy graph: reference and tests only, not used by runtime or deploys.
# Retained so app/tests/test_alembic/* and scripts/build_alembic_baseline.py can
# replay the historic graph, and so a database still at 4b3cbd7b15ff can be
# adopted. Remove after the post-3.1 confidence check; every release tag up to
# v3.1.1 keeps a recoverable copy. New installs use alembic.ini (one baseline).
[alembic]
script_location = %(here)s/app/alembic
version_locations = %(here)s/app/alembic/versions
prepend_sys_path = .
path_separator = os

sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
