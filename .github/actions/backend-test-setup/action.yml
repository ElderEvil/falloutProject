name: Set up backend test environment
description: >-
  Install uv and Python, sync the test dependency group, load the test env file,
  and apply migrations against the job's PostgreSQL/Redis services.

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        enable-cache: true
        cache-dependency-glob: backend/uv.lock

    - name: Set up Python
      shell: bash
      working-directory: backend
      # UV_PYTHON selects the matrix version when the caller sets it; otherwise
      # `uv python install` honours the checked-in .python-version pin.
      run: |
        if [ -n "${UV_PYTHON:-}" ]; then
          uv python install "$UV_PYTHON"
        else
          uv python install
        fi

    - name: Install dependencies
      shell: bash
      working-directory: backend
      run: uv sync --group test --locked

    - name: Set up test environment
      shell: bash
      working-directory: backend
      run: cp .env.example .env

    - name: Apply migrations
      shell: bash
      working-directory: backend
      run: uv run alembic upgrade head

    - name: Verify no pending model changes
      shell: bash
      working-directory: backend
      run: uv run alembic check

    - name: Verify head is applied
      shell: bash
      working-directory: backend
      run: uv run alembic current --check-heads
